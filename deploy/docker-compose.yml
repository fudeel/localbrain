# docker compose -f deploy/docker-compose.yml up --build
# The API token is created on first start. Read it with:
#   docker compose -f deploy/docker-compose.yml exec brain python -m brain token
services:
  brain:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8484:8484"
    volumes:
      - brain-data:/data
    restart: unless-stopped
    # Uncomment for an NVIDIA GPU (needs the NVIDIA Container Toolkit on the host):
    # gpus: all
    # Limits are detected, so the dashboard only offers agents that fit within them:
    # mem_limit: 8g
    # cpus: 4

volumes:
  brain-data:
